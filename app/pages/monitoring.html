<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>monitoring</title>
</head>
<body>
    <label for="time">Time showing:</label>
    <select name="time" id="time">
        <option value="4" selected>4 minutes</option>
        <option value="60">1 hour</option>
        <option value="300">5 hours</option>
        <option value="1440">1 day</option>
        <option value="10080">1 week</option>
        <option value="43800">1 month</option>
    </select>
    <h2 class="download">Network IN</h2>
    <div class="fullWidth"><canvas id="download" class="graph"></canvas></div>
    <h2 class="upload">Network OUT</h2>
    <div class="fullWidth"><canvas id="upload" class="graph"></canvas></div>
    <h2 class="cpu">CPU usage</h2>
    <div class="fullWidth"><canvas id="cpu" class="graph"></canvas></div>
    <h2 class="ram">RAM usage</h2>
    <div class="fullWidth"><canvas id="ram" class="graph"></canvas></div>
    <div id="tooltip"></div>
    <script src="/assets/js/pages/monitoring.min.js" rel="script"></script>
</body>
</html>
