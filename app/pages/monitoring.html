<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>monitoring</title>
</head>
<body>
    <div class="dropdown" id="time">
        <div class="dropdown-selected">Time: 4 minutes</div>
        <div class="dropdown-list">
            <div data-value="4">4 minutes</div>
            <div data-value="60">1 hour</div>
            <div data-value="300">5 hours</div>
            <div data-value="1440">1 day</div>
            <div data-value="10080">1 week</div>
            <div data-value="43800">1 month</div>
        </div>
        <input type="hidden" name="time" value="4">
    </div>

    <!-- Network IN -->
    <h2 class="download">Network IN</h2>
    <div class="graph-container">
        <div class="fullWidth">
            <canvas id="download" class="graph"></canvas>
        </div>
        <div class="graph-loader">
            <div class="lds-ring">
                <div></div><div></div><div></div><div></div>
            </div>
        </div>
    </div>

    <!-- Network OUT -->
    <h2 class="upload">Network OUT</h2>
    <div class="graph-container">
        <div class="fullWidth">
            <canvas id="upload" class="graph"></canvas>
        </div>
        <div class="graph-loader">
            <div class="lds-ring">
                <div></div><div></div><div></div><div></div>
            </div>
        </div>
    </div>

    <!-- CPU -->
    <h2 class="cpu">CPU usage</h2>
    <div class="graph-container">
        <div class="fullWidth">
            <canvas id="cpu" class="graph"></canvas>
        </div>
        <div class="graph-loader">
            <div class="lds-ring">
                <div></div><div></div><div></div><div></div>
            </div>
        </div>
    </div>

    <!-- RAM -->
    <h2 class="ram">RAM usage</h2>
    <div class="graph-container">
        <div class="fullWidth">
            <canvas id="ram" class="graph"></canvas>
        </div>
        <div class="graph-loader">
            <div class="lds-ring">
                <div></div><div></div><div></div><div></div>
            </div>
        </div>
    </div>

    <div id="tooltip"></div>

    <script src="/assets/js/pages/monitoring.min.js"></script>
</body>
</html>
