[global]
error_log = /dev/stderr

[www]
listen = /run/php-fpm.sock

user = nginx
group = nginx
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm.status_path = /fpm-status
ping.path = /fpm-ping

; IMPORTANT: dynamic, not ondemand
pm = dynamic

; HARD LIMIT — do not exceed
pm.max_children = 4

; Startup behavior
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Recycle workers to avoid fragmentation
pm.max_requests = 500

; Keep environment variables
clear_env = no

; Logging
catch_workers_output = yes
decorate_workers_output = no
